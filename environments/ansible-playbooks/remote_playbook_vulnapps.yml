---
- name: Deploy vulnerable applications to remote Ubuntu servers
  hosts: guardian_workers
  become: true
  gather_facts: false
  vars:
    groupname: ss
    username: ss
    code_dir: "/home/{{ username }}/code"
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Ensure Python 3 and apt dependencies are present
      raw: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        dpkg --configure -a || true
        apt-get install -f -y || true
        apt-get update -y
        apt-get install -y python3 python3-apt git curl
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Abort when not on Debian or Ubuntu
      ansible.builtin.fail:
        msg: "This playbook is intended for Debian or Ubuntu hosts because it relies on apt and Docker tooling."
      when: ansible_os_family | lower != "debian"

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
          - docker.io
          - python3-docker
        state: present
        update_cache: true

    - name: Detect available Docker Compose package
      ansible.builtin.shell: |
        if apt-cache show docker-compose-plugin >/dev/null 2>&1; then
          echo docker-compose-plugin
        else
          echo docker-compose
        fi
      register: docker_compose_package
      changed_when: false

    - name: Install Docker Compose package
      ansible.builtin.apt:
        name: "{{ docker_compose_package.stdout }}"
        state: present

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Detect Docker Compose command
      ansible.builtin.shell: |
        if docker compose version >/dev/null 2>&1; then
          echo "docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          echo "docker-compose"
        else
          exit 1
        fi
      register: docker_compose_cmd
      changed_when: false

    - name: Ensure application group exists
      ansible.builtin.group:
        name: "{{ groupname }}"
        state: present

    - name: Ensure sudo group exists
      ansible.builtin.group:
        name: sudo
        state: present

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ensure application user is present
      ansible.builtin.user:
        name: "{{ username }}"
        groups: "{{ groupname }},sudo,docker"
        append: true
        shell: /bin/bash
        state: present

    - name: Ensure code directory exists
      ansible.builtin.file:
        path: "{{ code_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ groupname }}"
        mode: "0755"

    - name: Pull upstream vulnerable app images
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ item }}"
      loop:
        - bkimminich/juice-shop
        - webgoat/webgoat
        - erev0s/vampi:latest

    - name: Clone DVWA repository
      ansible.builtin.git:
        repo: https://github.com/digininja/dvwa
        dest: "{{ code_dir }}/dvwa"
        force: true

    - name: Update DVWA compose port binding
      ansible.builtin.replace:
        path: "{{ code_dir }}/dvwa/compose.yml"
        regexp: '127\.0\.0\.1:4280:80'
        replace: '0.0.0.0:4280:80'

    - name: Ensure code directory ownership is correct
      ansible.builtin.file:
        path: "{{ code_dir }}"
        owner: "{{ username }}"
        group: "{{ groupname }}"
        recurse: true
        state: directory

    - name: Remove existing standalone containers
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ item }}"
      loop:
        - juice-shop
        - webgoat
        - vampi
      failed_when: false
      changed_when: false

    - name: Stop existing DVWA compose stack
      ansible.builtin.shell: "{{ docker_compose_cmd.stdout }} down --remove-orphans"
      args:
        chdir: "{{ code_dir }}/dvwa"
      register: dvwa_down
      failed_when: false
      changed_when: false

    - name: Start Juice Shop container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - juice-shop
          - --restart
          - unless-stopped
          - -p
          - 3000:3000
          - bkimminich/juice-shop

    - name: Start WebGoat container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - webgoat
          - --restart
          - unless-stopped
          - -p
          - 8082:8080
          - webgoat/webgoat

    - name: Start VAmPI container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - vampi
          - --restart
          - unless-stopped
          - -p
          - 5000:5000
          - erev0s/vampi:latest

    - name: Start DVWA compose stack
      ansible.builtin.shell: "{{ docker_compose_cmd.stdout }} up -d"
      args:
        chdir: "{{ code_dir }}/dvwa"

    - name: Wait for containers to be ready
      ansible.builtin.pause:
        seconds: 10

    - name: Display running containers
      ansible.builtin.command:
        argv:
          - docker
          - ps
      register: running_containers
      changed_when: false

    - name: Show running containers output
      ansible.builtin.debug:
        var: running_containers.stdout_lines
